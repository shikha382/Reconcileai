# Render Blueprint for ReconcileAI -- one Docker web service serving both
# the API and the built frontend from a single origin (see Dockerfile and
# backend/app/main.py). This is the simplest deployment architecture that
# fits the current codebase: the frontend makes only same-origin relative
# fetches (frontend/src/api/client.ts), so a single-origin deploy needs no
# CORS configuration and no frontend build-time API URL.
#
# Deploy: connect this repository in the Render dashboard and choose
# "New +" -> "Blueprint", or `render blueprint launch` with the Render CLI
# authenticated to your own account. Requires a Render account -- this file
# only describes the service, it does not deploy anything by itself.
services:
  - type: web
    name: reconcileai
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      # CORS_ALLOWED_ORIGINS is intentionally left unset: single-origin
      # serving needs no cross-origin allowance (see app/config.py -- an
      # empty list means no cross-origin requests are permitted at all).
      # PROVIDER_MODE defaults to "fixture" (backend/app/adapters/config.py)
      # and no Razorpay/LLM credentials are set here, so the deployed demo
      # runs deterministically on MockAIProvider and the synthetic dataset,
      # exactly like the documented local demo -- no secret is required and
      # none should be added to this file.
